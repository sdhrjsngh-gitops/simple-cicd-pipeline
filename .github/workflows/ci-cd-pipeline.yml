name: Simple CI/CD Pipeline

on:
  push:
     branches:
         - main

jobs:
  build:
     runs-on: ubuntu-latest
     steps:
       - name: Checkout code
         uses: actions/checkout@v3
       - name: Build Stage
         uses: echo "Build stage executed"

  test:
      runs-on: ubuntu-latest
      needs: build
      steps:
       - name: Test Stage
         uses: echo "Test stage executed"
  
   deploy:
      runs-on: ubuntu-latest
      needs: test
      steps:
       - name: Deploy Stage
         uses: echo "Deploy stage executed"

  notify:
      runs-on: ubuntu-latest
      needs: deploy
      steps:
       - name: Notify Stage
         uses: echo "Notify stage executed"
